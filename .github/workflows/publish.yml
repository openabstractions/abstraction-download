name: publish

# The Python package of one layer, uploaded to PyPI.
#
# An upload is permanent. PyPI deletes nothing: yanking hides a version from
# resolvers and leaves every file downloadable forever, and the version number
# can never be reused. So the only things that fire this are a tag a person
# pushed and a dispatch a person clicked on one. A push to a branch does not
# publish, and there is no schedule.
#
# There is no token in this file and there must never be one. PyPI Trusted
# Publishing mints a short-lived, single-use API token from this workflow's
# OIDC identity, and what it verifies is the repository, the workflow FILE NAME
# and the environment. That is why this file is publish.yml and why the upload
# job says `environment: pypi`: rename either and PyPI refuses the exchange.
# A `secrets.` reference appearing anywhere below means somebody reached for
# the wrong mechanism.
#
# Two jobs on purpose. Everything that can refuse runs first, in a job with no
# identity to spend; the upload is alone in the second, which is the one the
# environment gates. An approval rule on `pypi` therefore asks a person after
# the artifact has been built and opened, not before — the human decision sits
# where the irreversible act is.
#
# Generated by scripts/split.sh from one source. Editing the copy in a
# published repository is lost at the next publish.

on:
  push:
    tags: ['python/v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The version that built the wheels this contract was measured against.
  SETUPTOOLS_VERSION: '81.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          python3 --version
          git rev-parse HEAD
          printf 'ref %s, event %s\n' "$GITHUB_REF" "$GITHUB_EVENT_NAME"

      # The tag is the version. Nothing else here is allowed to decide it: a
      # workflow that publishes whatever number a file happens to hold can put
      # a version on PyPI that no tag in this repository points at, and PyPI
      # cannot take it back. python/vX.Y.Z is the sibling of the go/vX.Y.Z tags
      # this repository already carries; a dispatch against a branch lands here
      # and stops, by name.
      - name: the tag says which version
        id: tag
        run: |
          case "$GITHUB_REF_NAME" in
            python/v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              printf 'FAIL  %s is not a python/vX.Y.Z tag. This workflow publishes a tagged\n' "$GITHUB_REF_NAME"
              printf '      version and nothing else; run it against the tag, not a branch.\n'
              exit 1 ;;
          esac
          version=${GITHUB_REF_NAME#python/v}
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'ok    %s names version %s\n' "$GITHUB_REF_NAME" "$version"

      # setuptools' own build_meta hooks, one process each, which is how
      # scripts/package.sh builds the artifacts it opens: calling build_sdist
      # after build_wheel in one process writes the tarball somewhere other
      # than where it was told.
      #
      # A venv, not the runner's interpreter: a system Python that is
      # externally managed refuses `pip install` outright (PEP 668), and
      # nothing this job does belongs in a shared site-packages anyway.
      - name: build the sdist and the wheel
        working-directory: python
        env:
          DIST: ${{ github.workspace }}/dist
        run: |
          python3 -m venv "$RUNNER_TEMP/build"
          PY=$RUNNER_TEMP/build/bin/python
          "$PY" -m pip install --disable-pip-version-check --quiet \
            "setuptools==$SETUPTOOLS_VERSION"
          "$PY" -c 'import setuptools; print("setuptools", setuptools.__version__)'
          mkdir -p "$DIST"
          for hook in build_sdist build_wheel; do
            "$PY" -c 'import sys, setuptools.build_meta as m; getattr(m, sys.argv[1])(sys.argv[2])' \
              "$hook" "$DIST"
          done
          ls -l "$DIST"

      # What the package IS, read out of the archive rather than out of the
      # manifest that promised it. Everything below judges these two values.
      - name: what was built
        id: meta
        run: |
          # Counted before anything globs, so a build that produced the wrong
          # files says so in a sentence instead of dying in `ls`.
          n=$(ls dist | wc -l)
          if [ "$n" -ne 2 ] || [ ! -f "$(ls dist/*.whl 2>/dev/null | head -1)" ]; then
            printf 'FAIL  the build produced %s file(s): %s. Expected one wheel and one sdist.\n' \
              "$n" "$(ls dist | tr '\n' ' ')"
            exit 1
          fi
          whl=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)
          meta=$RUNNER_TEMP/METADATA
          unzip -p "$whl" '*.dist-info/METADATA' | tr -d '\r' > "$meta"
          name=$(sed -n 's/^Name: //p' "$meta" | head -1)
          version=$(sed -n 's/^Version: //p' "$meta" | head -1)
          [ -n "$name" ] && [ -n "$version" ] || {
            printf 'FAIL  the wheel METADATA carries no Name or no Version\n'; exit 1; }
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'ok    %s %s\n' "$name" "$version"
          printf '      %s\n      %s\n' "$(basename "$whl")" "$(basename "$sdist")"

      - name: the version inside equals the tag it was cut from
        env:
          TAGGED: ${{ steps.tag.outputs.version }}
          BUILT: ${{ steps.meta.outputs.version }}
        run: |
          if [ "$TAGGED" != "$BUILT" ]; then
            printf 'FAIL  the tag says %s and the artifact says %s. python/pyproject.toml and\n' "$TAGGED" "$BUILT"
            printf '      the tag disagree; one of them is wrong and neither may be guessed at.\n'
            exit 1
          fi
          printf 'ok    tag and artifact both say %s\n' "$BUILT"

      # The contract, asserted on the archive by the same script that asserts
      # it in the private tree — licence text, description, the floor, the way
      # back to this repository, our code and nothing vendored. A package that
      # reaches PyPI without its licence text cannot be corrected, only
      # superseded, so this runs before anything is uploaded and not after.
      - name: the contract, on the built artifacts
        run: |
          rc=0
          for f in dist/*; do
            sh scripts/package.sh --artifact "$f" || rc=1
          done
          [ "$rc" = 0 ] || {
            printf 'FAIL  an artifact does not carry what scripts/package.sh says every package carries\n'
            exit 1; }

      # --no-deps on purpose. Every sibling this package requires is being
      # published in the same batch and is not on the index yet, so resolving
      # them would fail for a reason that says nothing about this wheel. What
      # this proves is the wheel itself: that pip accepts it, and that what
      # lands is the module and its .dist-info and nothing else. Importing it
      # needs those siblings and is left UNPROVEN below.
      #
      # Nothing on this runner can lift that. On the first batch the index has
      # none of the siblings, so no arrangement of this job imports the module,
      # and one that could not be imported would be uploaded green. The check
      # that can decide it belongs where every package is built from one clone:
      # install each wheel and resolve its declared graph out of the others
      # with no index at all. That runs before a tag exists, which is the only
      # moment a version is still free. A green run here does not say the
      # module imports.
      - name: the wheel installs
        run: |
          python3 -m venv "$RUNNER_TEMP/try"
          "$RUNNER_TEMP/try/bin/pip" install --disable-pip-version-check --quiet \
            --no-deps --no-index dist/*.whl
          # pip show, not pip list: it normalises the name it is given, so this
          # does not depend on whether freeze prints a hyphen or an underscore.
          "$RUNNER_TEMP/try/bin/pip" show "$NAME" > "$RUNNER_TEMP/show.txt" || {
            printf 'FAIL  pip reported success and %s is not installed\n' "$NAME"; exit 1; }
          sed -n 's/^\(Name\|Version\|License-Expression\): /      &/p' "$RUNNER_TEMP/show.txt"
          printf 'ok    %s installs from the wheel\n' "$NAME"
        env:
          NAME: ${{ steps.meta.outputs.name }}

      # A version that exists is a version that can never be replaced, so the
      # refusal happens here, whole, rather than as a 400 from the index with
      # half the files already accepted. An answer that is neither 200 nor 404
      # is not a green light: it is an index we could not read.
      - name: this version is not on PyPI yet
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          url="https://pypi.org/pypi/$NAME/$VERSION/json"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url") || code=000
          case "$code" in
            404) printf 'ok    %s %s is free on PyPI\n' "$NAME" "$VERSION" ;;
            200) printf 'FAIL  %s %s is already on PyPI. A version is permanent — yanking hides it\n' "$NAME" "$VERSION"
                 printf '      and never frees the number. Tag the next version instead.\n'
                 exit 1 ;;
            *)   printf 'UNPROVEN  %s answered http %s. Whether %s %s exists is unknown, and an\n' "$url" "$code" "$NAME" "$VERSION"
                 printf '          unknown is not a pass when the next step cannot be undone.\n'
                 exit 1 ;;
          esac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # Not a matrix leg that was skipped: what a green run here does not say.
      - name: what this workflow did not run
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            printf '### %s %s\n\n' "$NAME" "$VERSION"
            printf 'Built from `%s`, opened by `scripts/package.sh --artifact`, absent from PyPI.\n\n' "$GITHUB_REF_NAME"
            printf '#### UNPROVEN\n\n'
            printf -- '- **The tests.** This workflow runs none. `build.yml` runs them on every\n'
            printf -- '  push to `main`; several layers test against sibling packages that are\n'
            printf -- '  not installed here, so running them at upload time would prove less\n'
            printf -- '  than it appears to, not more.\n'
            printf -- '- **Any other Python than this runner'"'"'s.** `Requires-Python` is asserted\n'
            printf -- '  present, never true. The floor is measured in the private tree.\n'
            printf -- '- **Importing it.** The wheel is installed here with `--no-deps` and\n'
            printf -- '  never imported: the siblings it requires are in this same batch and\n'
            printf -- '  are not on the index yet, and nothing on this runner can change\n'
            printf -- '  that. The check that decides it belongs where every package is\n'
            printf -- '  built from one clone and the declared graph resolves with no\n'
            printf -- '  index, before the tag. This job cannot be that check.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  # The only job that can spend an identity, and the only one that changes
  # anything outside this repository. No checkout: it uploads what the job
  # above built and nothing it could rebuild differently.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: what is about to become permanent
        env:
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          printf 'uploading %s %s to https://pypi.org/project/%s/\n' "$NAME" "$VERSION" "$NAME"
          sha256sum dist/*

      # Trusted Publishing. No password, no API token, no secret: the action
      # exchanges this job's OIDC token for a single-use one, and PyPI grants
      # it only to this repository, this file name and this environment.
      # attestations are left on — PEP 740 provenance, signed by the same
      # identity, is the difference between a file that says where it came
      # from and one that asks to be believed.
      #
      # v1.14.2 is an ANNOTATED tag, so `git ls-remote --tags` reports the tag
      # object a892a5a6 and not the commit. `uses:` takes a commit; pin the
      # dereferenced v1.14.2^{} or the action does not resolve at all. The
      # three actions/* tags above are lightweight and have no such second SHA.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
