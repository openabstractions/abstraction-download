[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstraction-download-request-protocol"
version = "0.0.0"
description = "Generated OpenAbstractions download-request protocol types and service clients"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["abstraction.download.request*"]
namespaces = true
